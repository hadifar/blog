baseURL: "https://hadifar.net/"
title: "Amir Hadifar"
theme: PaperMod

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

pagination:
  pagerSize: 10

enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true

googleAnalytics: "G-5GD2CF0WKN"

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories

permalinks:
  posts: /posts/:slug/
  categories: /categories/:slug/

languages:
  en:
    languageName: "English"
    languageCode: en-us
    weight: 1
    contentDir: content/en
    params:
      description: >-
        Amir Hadifar's personal blog on AI, ML, agents, LLMs, and agentic software development —
        concepts, tools, workflows, and resources from building with these systems day to day.
      homeInfoParams:
        Title: "AI Explorer 🦭"
        Content: >-
          Personal blog on AI, ML, agents, LLMs, and agentic software development.
    menu:
      main:
        - identifier: archives
          name: Archives
          url: /archives/
          weight: 10
        - identifier: categories
          name: Categories
          url: /categories/
          weight: 20
        - identifier: about
          name: About
          url: /about/
          weight: 40
        - identifier: search
          name: Search
          url: /search/
          weight: 50

  fa:
    languageName: "fa"
    languageCode: fa-ir
    languagedirection: rtl
    weight: 2
    contentDir: content/fa
    params:
      description: >-
        وبلاگ شخصی امیر هادیفر درباره هوش مصنوعی، یادگیری ماشین، ایجنت‌ها، مدل‌های زبانی بزرگ
        و توسعه نرم‌افزار ایجنتیک.
      homeInfoParams:
        Title: "کاوشگر هوش مصنوعی 🦭"
        Content: >-
          وبلاگ شخصی درباره هوش مصنوعی، یادگیری ماشین، ایجنت‌ها، مدل‌های زبانی بزرگ و توسعه نرم‌افزار.
  

params:
  env: production
  title: "Amir Hadifar"
  keywords: [Blog, AI, ML, LLM, Agents, Agentic Software Development]
  author: "Amir Hadifar"

  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: false
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: false
  TocOpen: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: false
  UseHugoToc: true

  socialIcons:
    - name: github
      url: "https://github.com/hadifar"
    - name: x
      url: "https://x.com/hadif4r"
    - name: linkedin
      url: "https://linkedin.com/in/hadif4r"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=vESJYOsAAAAJ"
    - name: stackoverflow
      url: "https://stackoverflow.com/users/1462770/amir"
    - name: email
      url: "mailto:lastname.firstname@gmail.com"

  assets:
    favicon: "/favicons/favicon.ico"
    favicon16x16: "/favicons/favicon-16x16.png"
    favicon32x32: "/favicons/favicon-32x32.png"
    apple_touch_icon: "/favicons/apple-touch-icon.png"
    safari_pinned_tab: "/favicons/favicon.svg"
    disableFingerprinting: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
